<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="certBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadowCertBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="100" cy="95" r="70" fill="url(#certBlue)" filter="url(#shadowCertBlue)"/>
  <circle cx="100" cy="95" r="58" fill="#0f172a"/>

  <!-- Graduation Cap -->
  <polygon points="100,55 145,72 100,89 55,72" fill="url(#certBlue)"/>
  <rect x="75" y="82" width="50" height="24" rx="4" fill="#1e40af"/>
  <path d="M135 74 V105" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="135" cy="107" r="4" fill="#93c5fd"/>

  <!-- Graduate Banner -->
  <rect x="45" y="132" width="110" height="24" rx="6" fill="#1e293b"/>
  <text x="100" y="148" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="1">GRADUATE</text>
</svg>
