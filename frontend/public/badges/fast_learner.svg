<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow26" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow26" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient26)" filter="url(#shadow26)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent26)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Lightning bolt icon -->
  <g transform="translate(100, 100)" filter="url(#glow26)">
    <polygon points="0,-40 15,-10 5,-10 20,30 0,0 10,0 -5,-40" fill="url(#badgeGradient26)" />
    <polygon points="0,-30 10,-8 3,-8 12,20 0,0 8,0 -3,-30" fill="#60a5fa" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
