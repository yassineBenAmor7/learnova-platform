<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient3)" filter="url(#shadow3)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent3)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Quiz target icon -->
  <g transform="translate(100, 100)" filter="url(#glow3)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#badgeGradient3)" stroke-width="4" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#badgeGradient3)" stroke-width="3" />
    <circle cx="0" cy="0" r="15" fill="url(#badgeGradient3)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <line x1="0" y1="-35" x2="0" y2="-40" stroke="#3b82f6" stroke-width="3" />
    <line x1="0" y1="35" x2="0" y2="40" stroke="#3b82f6" stroke-width="3" />
    <line x1="-35" y1="0" x2="-40" y2="0" stroke="#3b82f6" stroke-width="3" />
    <line x1="35" y1="0" x2="40" y2="0" stroke="#3b82f6" stroke-width="3" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
