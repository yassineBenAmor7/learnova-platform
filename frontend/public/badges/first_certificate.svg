<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient4)" filter="url(#shadow4)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent4)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Certificate icon -->
  <g transform="translate(100, 100)" filter="url(#glow4)">
    <rect x="-35" y="-40" width="70" height="80" rx="5" fill="url(#badgeGradient4)" />
    <rect x="-30" y="-35" width="60" height="70" rx="3" fill="#ffffff" />
    <rect x="-25" y="-25" width="50" height="30" rx="2" fill="#f8fafc" />
    <circle cx="0" cy="-10" r="12" fill="#3b82f6" />
    <path d="M-5,-10 L-2,-6 L5,-14" stroke="#ffffff" stroke-width="2" fill="none" />
    <rect x="-20" y="15" width="40" height="8" rx="2" fill="#1e40af" />
    <rect x="-20" y="28" width="25" height="6" rx="2" fill="#cbd5e1" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
