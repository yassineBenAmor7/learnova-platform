<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow27" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow27" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient27)" filter="url(#shadow27)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent27)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Crown icon -->
  <g transform="translate(100, 100)" filter="url(#glow27)">
    <path d="M-30,10 L-30,-20 L-15,-10 L0,-30 L15,-10 L30,-20 L30,10 Z" fill="url(#badgeGradient27)" />
    <rect x="-35" y="10" width="70" height="15" rx="3" fill="#1e40af" />
    <circle cx="-30" cy="-20" r="6" fill="#60a5fa" />
    <circle cx="0" cy="-30" r="8" fill="#60a5fa" />
    <circle cx="30" cy="-20" r="6" fill="#60a5fa" />
    <circle cx="-15" cy="-10" r="4" fill="#3b82f6" />
    <circle cx="15" cy="-10" r="4" fill="#3b82f6" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" r="15" fill="rgba(255,255,255,0.3)" />
</svg>
