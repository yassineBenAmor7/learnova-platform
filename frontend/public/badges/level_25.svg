<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow12" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient12)" filter="url(#shadow12)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent12)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Triple star icon -->
  <g transform="translate(100, 100)" filter="url(#glow12)">
    <polygon points="0,-38 9,-14 35,-14 14,4 23,32 0,19 -23,32 -14,4 -35,-14 -9,-14" fill="url(#badgeGradient12)" />
    <polygon points="0,-22 5,-9 20,-9 8,3 13,19 0,11 -13,19 -8,3 -20,-9 -5,-9" fill="#60a5fa" />
    <polygon points="0,-8 3,-2 10,-2 5,2 7,8 0,5 -7,8 -5,2 -10,-2 -3,-2" fill="#3b82f6" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
