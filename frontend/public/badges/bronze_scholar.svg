<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="blueBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="blueInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Blue Shield -->
  <path d="M100 15 L165 45 V105 C165 145 100 180 100 180 C100 180 35 145 35 105 V45 L100 15 Z" fill="url(#blueBorder)" filter="url(#shadowBlue)"/>
  <path d="M100 25 L153 49 V101 C153 135 100 165 100 165 C100 165 47 135 47 101 V49 L100 25 Z" fill="url(#blueInner)"/>

  <!-- Blue Ribbon Base -->
  <rect x="60" y="115" width="80" height="22" rx="4" fill="#1e40af"/>
  <text x="100" y="130" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SCHOLAR</text>

  <!-- Book Icon -->
  <path d="M72 70 C72 65 85 62 100 66 C115 62 128 65 128 70 V102 C128 102 113 98 100 102 C87 98 72 102 72 102 Z" fill="#1e40af"/>
  <path d="M100 66 V102" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Star Header -->
  <polygon points="100,38 104,46 113,47 106,53 108,62 100,57 92,62 94,53 87,47 96,46" fill="#3b82f6"/>
</svg>
