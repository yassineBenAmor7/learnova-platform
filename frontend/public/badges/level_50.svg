<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow13" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow13" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient13)" filter="url(#shadow13)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent13)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Grandmaster star with crown -->
  <g transform="translate(100, 100)" filter="url(#glow13)">
    <polygon points="0,-40 10,-15 38,-15 15,5 25,35 0,20 -25,35 -15,5 -38,-15 -10,-15" fill="url(#badgeGradient13)" />
    <polygon points="0,-25 6,-10 25,-10 10,3 18,22 0,12 -18,22 -10,3 -25,-10 -6,-10" fill="#60a5fa" />
    <polygon points="0,-10 3,-3 12,-3 6,1 9,9 0,5 -9,9 -6,1 -12,-3 -3,-3" fill="#3b82f6" />
    <path d="M-8,-45 L-4,-40 L0,-42 L4,-40 L8,-45 L6,-38 L0,-35 L-6,-38 Z" fill="#60a5fa" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
