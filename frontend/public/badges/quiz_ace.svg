<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="quizBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadowQuizBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="100" cy="95" r="70" fill="url(#quizBlue)" filter="url(#shadowQuizBlue)"/>
  <circle cx="100" cy="95" r="58" fill="#0f172a"/>

  <!-- Target Bullseye with Check -->
  <circle cx="100" cy="90" r="35" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="100" cy="90" r="22" fill="none" stroke="#93c5fd" stroke-width="4"/>
  <path d="M85 90 L95 100 L115 78" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Quiz Ace Banner -->
  <rect x="50" y="132" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="100" y="148" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">QUIZ ACE</text>
</svg>
