<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient2)" filter="url(#shadow2)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent2)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Book icon -->
  <g transform="translate(100, 100)" filter="url(#glow2)">
    <rect x="-30" y="-35" width="60" height="70" rx="5" fill="url(#badgeGradient2)" />
    <rect x="-25" y="-30" width="50" height="60" rx="3" fill="#ffffff" />
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#1e40af" stroke-width="2" />
    <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#1e40af" stroke-width="2" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#1e40af" stroke-width="2" />
    <line x1="-20" y1="10" x2="10" y2="10" stroke="#1e40af" stroke-width="2" />
    <circle cx="15" cy="20" r="8" fill="#3b82f6" />
    <path d="M15,16 L18,20 L12,20 Z" fill="#ffffff" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
