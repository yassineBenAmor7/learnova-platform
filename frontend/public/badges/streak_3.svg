<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow20" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient20)" filter="url(#shadow20)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent20)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Flame icon -->
  <g transform="translate(100, 100)" filter="url(#glow20)">
    <path d="M0,-40 C-15,-40 -25,-25 -25,-10 C-25,5 -15,15 0,15 C15,15 25,5 25,-10 C25,-25 15,-40 0,-40 Z" fill="url(#badgeGradient20)" />
    <ellipse cx="0" cy="-5" rx="8" ry="12" fill="#60a5fa" />
    <ellipse cx="0" cy="-5" rx="4" ry="8" fill="#ffffff" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
