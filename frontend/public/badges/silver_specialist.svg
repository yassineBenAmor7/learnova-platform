<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="blueHexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="blueHexInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadowHex" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <polygon points="100,12 170,52 170,132 100,172 30,132 30,52" fill="url(#blueHexBorder)" filter="url(#shadowHex)"/>
  <polygon points="100,24 158,58 158,126 100,160 42,126 42,58" fill="url(#blueHexInner)"/>

  <!-- Star Core -->
  <polygon points="100,45 112,69 138,73 119,92 124,118 100,105 76,118 81,92 62,73 88,69" fill="url(#blueHexBorder)"/>

  <!-- Ribbon Base -->
  <rect x="50" y="125" width="100" height="24" rx="6" fill="#1e40af"/>
  <text x="100" y="141" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SPECIALIST</text>
</svg>
