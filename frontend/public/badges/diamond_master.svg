<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Core Learnova Royal Blue Gradients -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1945" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </linearGradient>
    <!-- Metallic Tier Gradients -->
    <linearGradient id="tierRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tierAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Premium Drop Shadow & Glow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1945" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagonal Medallion -->
  <g filter="url(#badgeShadow)">
    <polygon points="120,8 184,28 224,84 224,156 184,212 120,232 56,212 16,156 16,84 56,28" 
             fill="url(#tierRim)" />
    <!-- Inner Dark Sapphire Shield -->
    <polygon points="120,16 178,34 214,86 214,154 178,206 120,224 62,206 26,154 26,86 62,34" 
             fill="url(#shieldBg)" />
    <!-- Fine Inner Line Accent -->
    <polygon points="120,24 172,40 204,88 204,152 172,200 120,216 68,200 36,152 36,88 68,40" 
             fill="none" stroke="url(#tierAccent)" stroke-width="1.75" stroke-opacity="0.75" stroke-dasharray="8 4" />
    <!-- Radial Top Bevel Sheen -->
    <path d="M62,34 L120,16 L178,34 L204,86 L36,86 Z" fill="url(#shieldHighlight)" opacity="0.6" />
  </g>
  <!-- Elegant Golden Laurels -->
  <g fill="url(#tierAccent)" opacity="0.9">
    <!-- Left Laurel -->
    <path d="M60,165 C68,175 80,185 96,192 C94,188 92,182 92,176 C80,172 70,162 60,165 Z" />
    <path d="M50,145 C55,152 64,160 74,163 C74,158 72,152 70,147 C62,146 55,142 50,145 Z" />
    <path d="M45,122 C48,130 55,136 65,138 C66,133 65,127 63,122 C56,122 50,119 45,122 Z" />
    <!-- Right Laurel -->
    <path d="M180,165 C172,175 160,185 144,192 C146,188 148,182 148,176 C160,172 170,162 180,165 Z" />
    <path d="M190,145 C185,152 176,160 166,163 C166,158 168,152 170,147 C178,146 185,142 190,145 Z" />
    <path d="M195,122 C192,130 185,136 175,138 C174,133 175,127 177,122 C184,122 190,119 195,122 Z" />
    <!-- Central Laurel Star -->
    <polygon points="120,196 122.5,203 130,203 124,207.5 126,214.5 120,210.5 114,214.5 116,207.5 110,203 117.5,203" fill="url(#tierAccent)" />
  </g>
  <!-- Prismatic Diamond Gemstone -->
  <g transform="translate(120, 108)" filter="url(#iconGlow)">
    <!-- Gem Facets -->
    <polygon points="0,-38 28,-18 42,-18 28,-4 0,42 -28,-4 -42,-18 -28,-18" fill="url(#tierAccent)" />
    <!-- Upper Facets -->
    <polygon points="-28,-18 0,-38 28,-18 0,-18" fill="#ffffff" opacity="0.75" />
    <polygon points="-42,-18 -28,-18 -24,-4 -36,-4" fill="#38bdf8" />
    <polygon points="42,-18 28,-18 24,-4 36,-4" fill="#0284c7" />
    <!-- Lower Body Facets -->
    <polygon points="-28,-18 0,-18 0,42 -28,-4" fill="#e0f2fe" opacity="0.85" />
    <polygon points="28,-18 0,-18 0,42 28,-4" fill="#0284c7" opacity="0.9" />
    <polygon points="-28,-4 0,42 0,42" fill="#bae6fd" />
    <!-- Sparkle Flashes -->
    <polygon points="-36,-32 -33,-25 -26,-22 -33,-19 -36,-12 -39,-19 -46,-22 -39,-25" fill="#ffffff" />
    <polygon points="34,-34 36,-28 42,-26 36,-24 34,-18 32,-24 26,-26 32,-28" fill="#ffffff" />
  </g>
</svg>
