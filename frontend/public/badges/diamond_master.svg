<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="badgeGradient10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueAccent10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
    <filter id="glow10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#badgeGradient10)" filter="url(#shadow10)" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueAccent10)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#ffffff" />
  
  <!-- Trophy with 5 stars -->
  <g transform="translate(100, 100)" filter="url(#glow10)">
    <path d="M-25,-30 L25,-30 L20,10 L-20,10 Z" fill="url(#badgeGradient10)" />
    <ellipse cx="0" cy="10" rx="20" ry="8" fill="#1e40af" />
    <rect x="-8" y="15" width="16" height="20" fill="url(#badgeGradient10)" />
    <rect x="-15" y="32" width="30" height="8" rx="2" fill="#1e40af" />
    <circle cx="-25" cy="-20" r="8" fill="#3b82f6" />
    <circle cx="25" cy="-20" r="8" fill="#3b82f6" />
    <path d="M-25,-20 L-25,-10 L-20,-10 Z" fill="#60a5fa" />
    <path d="M25,-20 L25,-10 L20,-10 Z" fill="#60a5fa" />
    <polygon points="0,-45 -5,-35 5,-35" fill="#3b82f6" />
    <polygon points="-15,-40 -18,-32 -12,-32" fill="#3b82f6" />
    <polygon points="15,-40 12,-32 18,-32" fill="#3b82f6" />
    <polygon points="0,-50 -3,-42 3,-42" fill="#60a5fa" />
    <polygon points="-20,-45 -22,-38 -18,-38" fill="#60a5fa" />
    <polygon points="20,-45 18,-38 22,-38" fill="#60a5fa" />
  </g>
  
  <circle cx="50" cy="50" r="4" fill="#3b82f6" />
  <circle cx="150" cy="50" r="4" fill="#3b82f6" />
  <circle cx="50" cy="150" r="4" fill="#3b82f6" />
  <circle cx="150" cy="150" r="4" fill="#3b82f6" />
  
  <ellipse cx="100" cy="70" rx="30" ry="15" fill="rgba(255,255,255,0.3)" />
</svg>
